<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Foram ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#5b0b46,#21001f 45%,#070008);
    font-family:Segoe UI,Arial,sans-serif;
    color:white;
}

/* Background */
.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:#ff2381;
    filter:blur(140px);
    opacity:.2;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation:glow 4s infinite alternate;
}

@keyframes glow{
    from{
        transform:translate(-50%,-50%) scale(.8);
        opacity:.15;
    }
    to{
        transform:translate(-50%,-50%) scale(1.4);
        opacity:.3;
    }
}

/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.1;transform:scale(.5)}
    to{opacity:1;transform:scale(1.7)}
}

/* Main */
.main{
    position:relative;
    z-index:10;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.content{
    width:90%;
}

/* Small text */
.small{
    font-size:18px;
    color:#ffc4dc;
    letter-spacing:5px;
    opacity:0;
    animation:fadeIn 2s 1s forwards;
}

/* FORAM */
.name{
    margin-top:15px;
    font-size:90px;
    font-weight:800;
    letter-spacing:8px;

    background:linear-gradient(
        90deg,
        #fff,
        #ff76ae,
        #fff,
        #ff4d94
    );

    background-size:300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    opacity:0;
    transform:scale(.3);

    animation:
        nameAppear 2s 1.8s forwards,
        gradientMove 4s 3.5s infinite linear;
}

@keyframes nameAppear{
    0%{
        opacity:0;
        transform:scale(.3);
        filter:blur(20px);
    }

    60%{
        opacity:1;
        transform:scale(1.15);
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes gradientMove{
    from{background-position:0%}
    to{background-position:300%}
}

/* Line */
.line{
    width:0;
    height:2px;
    margin:15px auto;

    background:#ff6da5;
    box-shadow:0 0 15px #ff4d94;

    animation:line 1.5s 3.4s forwards;
}

@keyframes line{
    to{width:280px}
}

/* Love text */
.love{
    font-size:28px;
    color:#ffe4ee;

    opacity:0;
    transform:translateY(25px);

    animation:fadeUp 1.5s 4s forwards;
}

.love span{
    color:#ff6da5;
    text-shadow:
        0 0 10px #ff4d94,
        0 0 30px #ff4d94;
}

/* Bottom */
.bottom{
    margin-top:20px;
    font-size:15px;
    color:#dca9bd;

    opacity:0;
    animation:fadeIn 2s 5s forwards;
}

/* Heart */
.bigHeart{
    position:absolute;
    left:50%;
    top:50%;

    font-size:35px;

    transform:translate(-50%,-50%);
    opacity:0;

    animation:
        heartAppear 1s 3.5s forwards,
        heartbeat 1.2s 4.5s infinite;
}

@keyframes heartAppear{
    from{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.3);
    }
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-50px;
    pointer-events:none;

    animation:floatUp linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0) scale(.5);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg) scale(1.2);
        opacity:0;
    }
}

/* Fade */
@keyframes fadeIn{
    to{opacity:1}
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */
@media(max-width:600px){

    .name{
        font-size:55px;
        letter-spacing:5px;
    }

    .love{
        font-size:22px;
    }

    .small{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="bg">

    <div class="glow"></div>

</div>


<div class="main">

    <div class="content">

        <div class="small">
            SOMEONE SPECIAL
        </div>

        <div class="name">
            HAUKLIIII
        </div>

        <div class="line"></div>

        <div class="love">
            I Love You <span>my sweet fomli</span> ❤️
        </div>

        <div class="bottom">
            You are my favourite part of every day ✨
        </div>

    </div>

</div>


<div class="bigHeart">
    ❤️
</div>


<script>

/* Stars */

for(let i=0;i<100;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"vw";

    star.style.top=
        Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*3+"s";

    document.querySelector(".bg")
    .appendChild(star);
}


/* Floating hearts */

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";

    const emojis=[
        "❤️",
        "💕",
        "💖",
        "💗",
        "💘",
        "✨"
    ];

    heart.innerHTML=
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];

    heart.style.left=
        Math.random()*100+"vw";

    heart.style.fontSize=
        (15+Math.random()*25)+"px";

    heart.style.animationDuration=
        (5+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,450);

</script>

</body>
</html>
